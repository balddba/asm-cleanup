[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "asm-cleanup"
version = "0.1.0"
description = "ASM directory walk, alias analysis, and OMF migration SQL helpers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fabric>=3.2.3",
    "loguru>=0.7.3",
    "pydantic>=2.13.3",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "PyJWT>=2.8.0",
    "keyring>=25.0.0",
    "keyrings.cryptfile>=1.3.9",
]

[project.scripts]
asm-cleanup = "asm_cleanup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["asm_cleanup"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
docs = [
    "playwright>=1.49.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
