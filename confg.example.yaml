# ASM cleanup — replace placeholders before use (host, user, grid_home, SSH key, DB names).
targets:
  lab:
    host: "oracledb.domain.net"
    user: "oracle"
    grid_home: "/u01/app/grid"
    oracle_sid: "+ASM"
    use_oraenv: true
    oraenv_path: "/usr/local/bin/oraenv"
    monitor_interval: 60
    monitor_count: 1
#    connect_kwargs:
#      key_filename: "/Users/username/.ssh/id_ed25519"
    # Empty list: walk discovers all ASM disk groups on the host (when supported by your flow).
    disk_groups: []
    databases:
      - homelab
    # Uncomment to walk only this subtree when asm_path is omitted:
    # default_asm_path: "+DATA/MYDB"
    # Optional PDB GUID → name for generated move SQL (ALTER SESSION SET CONTAINER):
    # pdb_guid_map:
    #   "49C96937E332EB45E0631A04010ABA14": "TOOLKITPDB"
